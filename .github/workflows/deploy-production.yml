name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Verify Cloudflare authentication is configured
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && { [ -z "$CLOUDFLARE_API_KEY" ] || [ -z "$CLOUDFLARE_EMAIL" ]; }; then
            echo "::error::Nenhuma credencial Cloudflare compatível foi encontrada nos GitHub Actions secrets."
            exit 1
          fi
          echo "Cloudflare authentication is configured."

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and validate artifact
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run validate:build-security
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Deploy to Cloudflare Pages production
        run: npx wrangler pages deploy out --project-name=telma-santos --branch=main

      - name: Validate production
        run: npm run check:production
