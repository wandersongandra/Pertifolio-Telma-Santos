name: Sync Cloudflare Production Branch

on:
  workflow_run:
    workflows: ["CI and Security"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sync-cloudflare-production
  cancel-in-progress: true

jobs:
  sync-production:
    name: sync-master-to-main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Ensure validated commit is still current master
        shell: bash
        run: |
          git fetch origin master main
          validated="${{ github.event.workflow_run.head_sha }}"
          current_master="$(git rev-parse origin/master)"
          if [ "$validated" != "$current_master" ]; then
            echo "A newer master exists; the newer CI run will handle production sync."
            exit 0
          fi

          if git show-ref --verify --quiet refs/remotes/origin/main; then
            if ! git merge-base --is-ancestor origin/main "$validated"; then
              echo "::error::main diverged from validated master; refusing non-fast-forward sync."
              exit 1
            fi
          fi

          git push origin "$validated":refs/heads/main
