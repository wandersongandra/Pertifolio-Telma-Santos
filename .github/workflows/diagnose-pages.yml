name: Diagnose Cloudflare Branch Deployment

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/diagnose-pages.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Compare production and master preview
        shell: bash
        run: |
          set -u
          for base in "https://www.telmaformadoraeducacional.com.br" "https://telma-santos.pages.dev" "https://master.telma-santos.pages.dev"; do
            echo "=== $base ==="
            code=$(curl -L -sS -o /tmp/body -D /tmp/headers -w "%{http_code}" --max-time 15 "$base/" || true)
            echo "HTTP $code"
            printf "Gandra link: "; grep -q "https://gandra.tech" /tmp/body && echo YES || echo NO
            printf "Wanderson: "; grep -q "Wanderson Gandra" /tmp/body && echo YES || echo NO
            printf "CSP hash: "; grep -i "^content-security-policy:" /tmp/headers | grep -q "sha256-" && echo YES || echo NO
            printf "security.txt: "
            scode=$(curl -L -sS -o /tmp/security -w "%{http_code}" --max-time 15 "$base/.well-known/security.txt" || true)
            echo "$scode"
          done
